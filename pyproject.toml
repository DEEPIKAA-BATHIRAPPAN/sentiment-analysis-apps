[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cloud-sentiment-analysis"
version = "1.0.0"
description = "A reusable TF-IDF and Logistic Regression sentiment analysis package."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "scikit-learn>=1.3",
]

[tool.setuptools]
packages = ["sentiment_package"]
include-package-data = true

[tool.setuptools.package-data]
sentiment_package = ["models/*.pkl"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
